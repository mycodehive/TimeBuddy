<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>TimeBuddy</title><link rel="stylesheet" href="style.css"></head><body><div class="shell">
<header><div class="brand"><span class="mark">✦</span><strong>TimeBuddy</strong><small id="version"></small></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></header>
<main id="home" hidden><section class="hero"><div><span class="eyebrow" data-i="eyebrow"></span><h1 data-i="hello"></h1><p data-i="tagline"></p><span class="pill" id="status"></span></div><img class="buddy" src="assets/buddy.png" alt=""></section>
<section class="cards"><article class="tile timer"><span data-i="remaining"></span><strong id="remaining">00:00:00</strong><p id="until"></p><progress id="meter" max="100" value="0"></progress></article><article class="tile"><span data-i="today"></span><strong id="today">0</strong><p data-i="minutes"></p></article><article class="tile"><span data-i="week"></span><strong id="week">0</strong><p data-i="minutes"></p></article></section>
<section class="tile"><div class="sectionhead"><h2 data-i="history"></h2><select id="period"><option value="7" data-i="days7"></option><option value="30" data-i="days30"></option></select></div><div id="chart"></div><p id="month"></p></section><div class="footer"><button id="parentBtn" class="secondary" data-i="parent"></button></div></main>
<main id="parent" hidden><div class="sectionhead"><div><span class="eyebrow" data-i="family"></span><h1 data-i="parent"></h1></div><button class="secondary" id="back" data-i="back"></button></div>
<section class="tile"><div class="sectionhead"><h2 data-i="schedule"></h2><span class="sub" data-i="scheduleHint"></span></div><div id="schedule"></div></section>
<div class="two"><section class="tile"><h2 data-i="limits"></h2><label><span data-i="daily"></span><input id="limit" type="number" min="0" max="1440"></label><label><span data-i="extra"></span><input id="extra" type="number" min="1" max="720"></label><p class="sub" data-i="limitHint"></p></section>
<section class="tile"><h2>Telegram</h2><label><span data-i="token"></span><input id="token" type="password" autocomplete="off"></label><label><span data-i="chat"></span><input id="chat" inputmode="numeric"></label><label class="check"><input id="clearToken" type="checkbox"><span data-i="clearToken"></span></label><label class="check"><input id="remote" type="checkbox"><span data-i="remote"></span></label><p class="sub" data-i="telegramHint"></p><button class="secondary" data-action="telegram" data-i="testTelegram"></button></section></div>
<div class="two"><section class="tile"><h2 data-i="system"></h2><label class="check"><input id="autoStart" type="checkbox"><span data-i="autoStart"></span></label><label class="check"><input id="autoUpdate" type="checkbox"><span data-i="autoUpdate"></span></label><label><span data-i="newPassword"></span><input id="newPassword" type="password" maxlength="128" autocomplete="new-password"></label><div class="buttons"><button class="secondary" data-action="check-update" data-i="checkUpdate"></button><button class="secondary" data-action="download-update" data-i="downloadUpdate"></button><button class="secondary" data-action="install-update" data-i="installUpdate"></button></div><p id="updateStatus" class="sub"></p></section>
<section class="tile"><h2 data-i="actions"></h2><div class="buttons"><button class="secondary" data-action="preview" data-i="preview"></button><button class="secondary" data-action="extend" data-i="grant"></button><button class="secondary" data-action="lock" data-i="lockNow"></button><button class="secondary" data-action="uninstall" data-i="uninstall"></button><button class="secondary" data-action="quit" data-i="quit"></button></div></section></div>
<div class="savebar"><span id="saveStatus" role="status"></span><button id="save" data-i="save"></button></div></main>
<main id="rest" hidden><section class="rest-card"><img class="buddy" src="assets/buddy.png" alt=""><span class="eyebrow" data-i="eyebrow"></span><h1 data-i="rest"></h1><p data-i="restHint"></p><span id="previewNote" class="pill" data-i="preview" hidden></span><div class="buttons"><button id="unlockBtn" data-i="askMore"></button><button class="secondary" id="lockParent" data-i="parent"></button></div><p class="sub" data-i="respect"></p></section></main>
<main id="warning" hidden><section class="warning-card"><img class="buddy" src="assets/buddy.png" alt=""><h2 data-i="warning"></h2><strong id="warningTime">00:05:00</strong><p data-i="warningHint"></p><button id="dismiss" data-i="okay"></button></section></main>
<dialog id="slotDialog" aria-labelledby="slotTitle"><form id="slotForm"><h2 id="slotTitle" data-i="editTime"></h2><p class="sub" data-i="slotHint"></p><div class="time-fields"><label><span data-i="start"></span><input id="slotStart" type="time" required></label><label><span data-i="end"></span><input id="slotEnd" type="time" required></label></div><p id="slotError" class="error" role="alert"></p><div class="buttons"><button type="button" class="secondary" id="slotCancel" data-i="cancel"></button><button type="submit" data-i="applyTime"></button></div></form></dialog>
<dialog id="authDialog"><form id="authForm"><h2 id="authTitle"></h2><p id="authHint"></p><label><span data-i="password"></span><input id="password" type="password" required maxlength="128" autocomplete="current-password"></label><label id="confirmRow" hidden><span data-i="confirm"></span><input id="confirm" type="password" maxlength="128" autocomplete="new-password"></label><p id="error" role="alert" class="error"></p><div class="buttons"><button type="button" class="secondary" id="cancel" data-i="cancel"></button><button type="submit" id="authSubmit" data-i="continue"></button></div></form></dialog>
</div><script src="renderer.js"></script></body></html>
