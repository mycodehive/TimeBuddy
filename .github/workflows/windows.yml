name: Windows Electron build
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TimeBuddy-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/version mismatch" }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.exe$|\.blockmap$|^latest\.yml$' } | ForEach-Object FullName)
          if ($assets.Count -lt 3) { throw "Missing update assets" }
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --verify-tag --title "TimeBuddy $version" --generate-notes }
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
